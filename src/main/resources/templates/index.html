<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionary Management</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.1.3/css/bootstrap.min.css}">
    <!-- Font Awesome -->
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/5.15.4/css/all.min.css}">
    <!-- DataTables CSS -->
    <link rel="stylesheet" th:href="@{/webjars/datatables/1.11.4/css/dataTables.bootstrap5.min.css}">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Dictionary Management</h1>
        
        <div class="card mb-4">
            <div class="card-header">
                <div class="row">
                    <div class="col-md-6">
                        <h5>Dictionary Entries</h5>
                    </div>
                    <div class="col-md-6">
                        <div class="float-end">
                            <select id="dictionarySelect" class="form-select">
                                <option value="">Select Dictionary</option>
                                <option th:each="file : ${dictionaryFiles}" th:value="${file}" th:text="${file}"></option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table id="dictionaryTable" class="table table-striped table-bordered" style="width:100%">
                        <thead>
                            <tr>
                                <th><input type="checkbox" id="selectAll"></th>
                                <th>From</th>
                                <th>To</th>
                                <th>Known</th>
                                <th>Frequency</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Table content will be loaded dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer">
                <button id="deleteSelectedBtn" class="btn btn-danger" disabled>
                    <i class="fas fa-trash"></i> Delete Selected
                </button>
                <button id="addEntryBtn" class="btn btn-primary float-end">
                    <i class="fas fa-plus"></i> Add Entry
                </button>
            </div>
        </div>
    </div>
    
    <!-- Add/Edit Entry Modal -->
    <div class="modal fade" id="entryModal" tabindex="-1" aria-labelledby="entryModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="entryModalLabel">Add Entry</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="entryForm">
                        <input type="hidden" id="entryIndex">
                        <div class="mb-3">
                            <label for="fromInput" class="form-label">From</label>
                            <input type="text" class="form-control" id="fromInput" required>
                        </div>
                        <div class="mb-3">
                            <label for="toInput" class="form-label">To</label>
                            <input type="text" class="form-control" id="toInput" required>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="knownCheck">
                            <label class="form-check-label" for="knownCheck">Known</label>
                        </div>
                        <div class="mb-3">
                            <label for="freqInput" class="form-label">Frequency</label>
                            <input type="number" class="form-control" id="freqInput" min="0" value="0" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveEntryBtn">Save</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteConfirmModalLabel">Confirm Deletion</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete the selected entries? This action cannot be undone.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- jQuery -->
    <script th:src="@{/webjars/jquery/3.6.0/jquery.min.js}"></script>
    <!-- Bootstrap JS -->
    <script th:src="@{/webjars/bootstrap/5.1.3/js/bootstrap.bundle.min.js}"></script>
    <!-- DataTables JS -->
    <script th:src="@{/webjars/datatables/1.11.4/js/jquery.dataTables.min.js}"></script>
    <script th:src="@{/webjars/datatables/1.11.4/js/dataTables.bootstrap5.min.js}"></script>
    <!-- Custom JS -->
    <script th:src="@{/js/dictionary.js}"></script>
</body>
</html>
